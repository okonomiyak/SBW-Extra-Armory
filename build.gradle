plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// mods.toml's version = "${file.jarVersion}" resolves from this manifest attribute at mod load.
tasks.named('jar', Jar) {
    manifest {
        attributes(['Implementation-Version': project.version])
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev1'
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.mcmodderanchor' }
    }
}

dependencies {
    // Hard dependency: SmokeClusterGrenadeEntity extends SuperbWarfare's GunGrenadeEntity directly.
    // Compiled against 0.8.9.1-hotfix; the same jar also runs on 0.8.9.0 (see SbwCompat).
    // Run the dev client/server on 0.8.9.0 with `-Psbw_runtime_file=8104849`.
    // `gradlew compileJava -Psbw_file=8104849` should only fail in the version-guarded spots -
    // ClientModEvents.ModernVehicleRenderers and VehicleAmmoBoxItem's decoy refill.
    def sbwCompileFile = project.findProperty('sbw_file') ?: '8689629'
    modCompileOnly "curse.maven:superb-warfare-1218165:${sbwCompileFile}"
    modRuntimeOnly "curse.maven:superb-warfare-1218165:${project.findProperty('sbw_runtime_file') ?: sbwCompileFile}"

    // Simple Bedrock Model, the model library SBW 0.8.9.1+ bundles (jar-in-jar) and loads at runtime.
    // AssaultBoatRenderer turns bones through its BoneState API, so it is needed to compile only.
    // Same coordinates SBW 0.8.9.1 builds against.
    modCompileOnly 'com.github.mcmodderanchor:simplebedrockmodel:2.5.1-forge-mc1.20.1'
    // Simple Bedrock Model's model classes extend MAE types (it bundles mae-1.1.4 as jar-in-jar),
    // so javac needs MAE to see VehicleModelInstance's supertypes. Plain library on Maven Central.
    compileOnly 'com.maydaymemory:mae:1.1.4'

    // GrenadeCarbineItem/GrenadeCarbineItemModel compile directly against GeckoLib's renderer API.
    modImplementation 'curse.maven:geckolib-388172:8285794'

    // SuperbWarfare itself requires these to load; not declared transitively by CurseMaven,
    // so the dev client/server needs them listed explicitly to boot.
    modRuntimeOnly 'thedarkcolour:kotlinforforge:4.12.0'
    modRuntimeOnly 'curse.maven:curios-309927:6418456'

    // Dev-only convenience: browse items/recipes in the dev client.
    modRuntimeOnly 'maven.modrinth:u6dRKJwZ:MdKE2PdF' // JEI 15.20.0.128
}

// SBW 0.8.9.0 renders vehicles with GeckoLib, which only loads geo files from geo/ - ship a copy of
// each vehicle model there too (referenced by the "Model" block in assets/sbwarmory/sbw/vehicles/*.json).
tasks.named('processResources', ProcessResources) {
    from('src/main/resources/assets/sbwarmory/models/bedrock/vehicle') {
        include '*.geo.json'
        into 'assets/sbwarmory/geo/vehicle'
    }
}
